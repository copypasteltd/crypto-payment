<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵办词元 Dashboard</title>
  <style>
    :root {
      --font-body: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", "Consolas", monospace;
      --radius-panel: 16px;
      --radius-soft: 12px;
      --radius-pill: 999px;
      --transition-fast: 180ms ease;
    }

    body[data-theme="dark"] {
      --bg: #0a0c10;
      --bg-2: #10151d;
      --surface: #121822;
      --surface-2: #0f141c;
      --surface-3: #171f2a;
      --surface-4: #1d2632;
      --line: #2a3340;
      --line-strong: #3c4756;
      --text: #eef2f7;
      --muted: #8b98a9;
      --accent: #6f84ff;
      --accent-soft: rgba(111, 132, 255, 0.14);
      --success: #96df72;
      --success-soft: rgba(150, 223, 114, 0.14);
      --warn: #d2a24a;
      --warn-soft: rgba(210, 162, 74, 0.14);
      --danger: #e17777;
      --danger-soft: rgba(225, 119, 119, 0.12);
      --hero: linear-gradient(180deg, rgba(111, 132, 255, 0.16), rgba(111, 132, 255, 0.04));
      --shadow-card: 0 16px 32px rgba(0, 0, 0, 0.22);
    }

    body[data-theme="light"] {
      --bg: #eef2f7;
      --bg-2: #e2e9f2;
      --surface: #ffffff;
      --surface-2: #f3f7fc;
      --surface-3: #eaf0f8;
      --surface-4: #dfe8f3;
      --line: #c9d4e1;
      --line-strong: #abb9cb;
      --text: #19212d;
      --muted: #687789;
      --accent: #5168ea;
      --accent-soft: rgba(81, 104, 234, 0.12);
      --success: #4f9d39;
      --success-soft: rgba(79, 157, 57, 0.12);
      --warn: #b27b1f;
      --warn-soft: rgba(178, 123, 31, 0.12);
      --danger: #c45a5a;
      --danger-soft: rgba(196, 90, 90, 0.12);
      --hero: linear-gradient(180deg, rgba(81, 104, 234, 0.12), rgba(81, 104, 234, 0.04));
      --shadow-card: 0 10px 24px rgba(25, 36, 51, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      color: var(--text);
      font-family: var(--font-body);
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    button {
      border: 0;
      margin: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      background: none;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 72px 1fr;
      position: relative;
    }

    .rail,
    .sidebar,
    .brand,
    .nav-btn,
    .mini-card,
    .theme-btn,
    .toolbar-chip,
    .lang-switch,
    .page-card,
    .hero-card,
    .metric-card,
    .filter-card,
    .workshop-card,
    .list-card,
    .detail-card,
    .message-card,
    .composer,
    .subtab-btn,
    .route-btn,
    .package-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }

    .rail {
      padding: 16px 0;
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 12px;
      background: var(--surface-2);
      border-radius: 0;
      border-top: 0;
      border-bottom: 0;
      border-left: 0;
      box-shadow: none;
      position: relative;
      z-index: 30;
    }

    .rail-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }

    .rail-btn.active {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--surface-3);
    }

    .rail-nav {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .drawer-toggle {
      transition: transform var(--transition-fast), background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .drawer-toggle.active {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--surface-3);
    }

    body[data-sidebar="open"] .drawer-toggle .icon {
      transform: scaleX(-1);
    }

    .sidebar {
      padding: 18px 16px;
      display: grid;
      align-content: start;
      gap: 14px;
      background: var(--surface-2);
      border-radius: 0 20px 20px 0;
      border-top: 0;
      border-bottom: 0;
      box-shadow: var(--shadow-card);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 72px;
      width: 248px;
      overflow-y: auto;
      transform: translateX(-28px);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--transition-fast), opacity var(--transition-fast);
      z-index: 24;
    }

    body[data-sidebar="open"] .sidebar {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-header {
      display: flex;
      justify-content: flex-end;
    }

    .sidebar-close {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-3);
      color: var(--muted);
      box-shadow: var(--shadow-card);
    }

    body[data-sidebar="open"] .sidebar-close .icon {
      transform: scaleX(-1);
    }

    .sidebar-scrim {
      position: fixed;
      inset: 0 0 0 72px;
      border: 0;
      opacity: 0;
      pointer-events: none;
      background: rgba(10, 12, 16, 0.34);
      backdrop-filter: blur(2px);
      transition: opacity var(--transition-fast);
      z-index: 18;
    }

    body[data-theme="light"] .sidebar-scrim {
      background: rgba(25, 34, 45, 0.12);
    }

    .brand,
    .mini-card,
    .theme-btn,
    .page-card,
    .hero-card,
    .metric-card,
    .filter-card,
    .workshop-card,
    .list-card,
    .detail-card,
    .message-card,
    .composer,
    .package-card {
      padding: 14px;
    }

    .brand,
    .mini-card,
    .filter-card,
    .workshop-card,
    .list-card,
    .detail-card,
    .package-card {
      display: grid;
      gap: 10px;
    }

    .brand-row,
    .title-row,
    .toolbar,
    .toolbar-group,
    .card-row,
    .section-head,
    .pill-row,
    .message-head,
    .task-row,
    .split-row,
    .subtab-row,
    .instance-head {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .section-head,
    .toolbar,
    .message-head,
    .task-row,
    .instance-head {
      justify-content: space-between;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface-3);
      flex: 0 0 auto;
    }

    .brand-sub,
    .eyebrow,
    .muted,
    .meta,
    .submeta,
    .section-note,
    .route-note,
    .tech-note,
    .tiny-note {
      color: var(--muted);
    }

    .brand-title,
    .brand-sub,
    .eyebrow,
    .metric-value,
    .metric-label,
    .nav-text,
    .mono,
    .workshop-title,
    .list-title,
    .detail-title,
    .message-title,
    .tab-title,
    .file-name,
    code,
    .pill,
    .path-chip,
    .route-btn,
    .subtab-btn,
    .fake-input,
    .title-wrap h1 {
      font-family: var(--font-mono);
    }

    .brand-sub,
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
    }

    .muted,
    .meta,
    .submeta,
    .section-note,
    .route-note,
    .tech-note,
    .tiny-note {
      font-size: 12px;
      line-height: 1.7;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-btn {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      transition: transform var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
    }

    .nav-btn.active {
      color: var(--text);
      background: var(--surface-3);
      border-color: var(--line-strong);
    }

    .nav-btn:hover,
    .rail-btn:hover,
    .theme-btn:hover,
    .subtab-btn:hover,
    .route-btn:hover,
    .package-card:hover {
      transform: translateY(-1px);
    }

    .sidebar-foot {
      display: grid;
      gap: 10px;
    }

    .main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      margin-left: 0;
      transition: margin-left var(--transition-fast);
    }

    body[data-sidebar="open"] .main {
      margin-left: 248px;
    }

    .topbar {
      padding: 16px 18px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }

    .drawer-inline-toggle {
      width: 36px;
      height: 36px;
      display: none;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      box-shadow: var(--shadow-card);
      flex: 0 0 auto;
    }

    body[data-sidebar="open"] .drawer-inline-toggle .icon {
      transform: scaleX(-1);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .title-wrap p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .toolbar-group {
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      gap: 6px;
      padding: 4px;
      background: var(--surface-3);
    }

    .lang-btn,
    .toolbar-chip,
    .pill,
    .path-chip,
    .route-btn,
    .subtab-btn {
      padding: 7px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      border: 1px solid transparent;
    }

    .lang-btn,
    .toolbar-chip,
    .pill,
    .path-chip,
    .route-btn {
      background: var(--surface-3);
      color: var(--muted);
    }

    .lang-btn.active,
    .pill.active,
    .path-chip.active,
    .route-btn.active,
    .toolbar-chip.active,
    .subtab-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .pill.success,
    .path-chip.success {
      color: var(--success);
      background: var(--success-soft);
    }

    .pill.warn,
    .path-chip.warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .pill.danger,
    .path-chip.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .subtab-btn {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .views {
      padding: 16px;
      min-width: 0;
    }

    .view {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .hero-card {
      padding: 18px;
      display: grid;
      gap: 14px;
      background: var(--hero), var(--surface);
    }

    .hero-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      font-family: var(--font-mono);
    }

    .metric-grid,
    .workshop-grid,
    .panel-grid,
    .instance-layout,
    .conversation-stack,
    .detail-stack,
    .creator-layout,
    .tab-grid {
      display: grid;
      gap: 12px;
    }

    .metric-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .metric-card {
      display: grid;
      gap: 6px;
      background: var(--surface-2);
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
    }

    .page-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 12px;
    }

    .workshop-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .workshop-card,
    .package-card {
      background: var(--surface);
      overflow: hidden;
    }

    .cover {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-bottom: 1px solid var(--line);
      background: var(--surface-3);
      margin: -14px -14px 0;
      width: calc(100% + 28px);
    }

    .workshop-title,
    .list-title,
    .detail-title,
    .tab-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .fake-input {
      padding: 12px;
      border-radius: var(--radius-soft);
      border: 1px solid var(--line);
      background: var(--surface-3);
      color: var(--muted);
      font-size: 12px;
    }

    .instance-layout {
      grid-template-columns: 300px 1fr 336px;
      min-height: 720px;
    }

    .list-card.active,
    .package-card.active {
      background: var(--surface-3);
      border-color: var(--line-strong);
    }

    .list-route,
    .file-meta,
    .message-meta,
    .route-code {
      font-size: 11px;
      line-height: 1.65;
      color: var(--muted);
      font-family: var(--font-mono);
      word-break: break-all;
    }

    .conversation-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 100%;
    }

    .summary-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--surface-2);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .summary-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 14px;
    }

    .summary-panel summary::-webkit-details-marker {
      display: none;
    }

    .summary-panel[open] summary {
      border-bottom: 1px solid var(--line);
    }

    .summary-panel-body {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .quick-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .quick-box {
      padding: 12px;
      border-radius: var(--radius-soft);
      border: 1px solid var(--line);
      background: var(--surface-3);
      display: grid;
      gap: 6px;
    }

    .quick-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .quick-value {
      font-size: 12px;
      line-height: 1.6;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .thread {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .message-card.agent {
      border-left: 2px solid var(--accent);
    }

    .message-card.user {
      border-left: 2px solid var(--success);
    }

    .message-card.system {
      border-left: 2px solid var(--warn);
    }

    .message-body {
      font-size: 13px;
      line-height: 1.78;
    }

    .composer {
      display: grid;
      gap: 10px;
      background: var(--surface-2);
    }

    .composer-box {
      min-height: 56px;
      padding: 12px;
      border-radius: var(--radius-soft);
      border: 1px solid var(--line);
      background: var(--surface-3);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.75;
      font-family: var(--font-mono);
    }

    .detail-stack {
      align-content: start;
    }

    .detail-card {
      background: var(--surface-2);
    }

    .subtab-row {
      gap: 8px;
    }

    .detail-body {
      display: grid;
      gap: 10px;
    }

    .detail-item,
    .file-row,
    .audit-row {
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 4px;
    }

    .file-name {
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    .creator-layout {
      grid-template-columns: 300px 1fr;
      min-height: 720px;
    }

    details.tech-details {
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--surface-2);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    details.tech-details summary {
      list-style: none;
      cursor: pointer;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
    }

    details.tech-details summary::-webkit-details-marker {
      display: none;
    }

    details.tech-details[open] summary {
      border-bottom: 1px solid var(--line);
    }

    .tech-body {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .tech-box {
      padding: 12px;
      border-radius: var(--radius-soft);
      border: 1px solid var(--line);
      background: var(--surface-3);
      display: grid;
      gap: 6px;
    }

    .tech-box h4 {
      margin: 0;
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .theme-btn .sun,
    body[data-theme="dark"] .theme-btn .moon,
    body[data-theme="light"] .theme-btn .sun {
      display: none;
    }

    body[data-theme="dark"] .theme-btn .sun,
    body[data-theme="light"] .theme-btn .moon {
      display: block;
    }

    .icon {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 1440px) {
      .page-grid,
      .workshop-grid,
      .instance-layout,
      .creator-layout,
      .quick-grid,
      .tech-grid,
      .metric-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1240px) {
      body[data-sidebar="open"] .main {
        margin-left: 0;
      }

      body[data-sidebar="open"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        left: 0;
        width: min(280px, 84vw);
        border-radius: 0 20px 20px 0;
      }

      .rail {
        display: none;
      }

      .sidebar-scrim {
        inset: 0;
      }

      .drawer-inline-toggle {
        display: grid;
      }

      .topbar,
      .views {
        padding: 12px;
      }
    }
  </style>
</head>

                  <span class="path-chip">${bi(L("生成摘要", "Generate brief"))}</span>
                </div>
              </div>
            </div>

            <div class="detail-stack">
              <article class="detail-card">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">${bi(L("实例详情", "Instance Detail"))}</div>
                    <div class="detail-title">${bi(L("右侧二级信息区", "Secondary detail surface"))}</div>
                  </div>
                  <span class="pill">${bi(L("按需展开", "On demand"))}</span>
                </div>
                <div class="subtab-row">
                  <button class="subtab-btn ${state.instanceTab === "overview" ? "active" : ""}" type="button" data-instance-tab="overview">${bi(L("概览", "Overview"))}</button>
                  <button class="subtab-btn ${state.instanceTab === "files" ? "active" : ""}" type="button" data-instance-tab="files">${bi(L("文件", "Files"))}</button>
                  <button class="subtab-btn ${state.instanceTab === "runtime" ? "active" : ""}" type="button" data-instance-tab="runtime">${bi(L("运行", "Runtime"))}</button>
                  <button class="subtab-btn ${state.instanceTab === "audit" ? "active" : ""}" type="button" data-instance-tab="audit">${bi(L("审计", "Audit"))}</button>
                </div>
                ${renderInstanceTabContent(instance)}
              </article>
            </div>
          </div>
        </section>
      `;
    }

    function renderCreatorTabContent(pkg) {
      const tabData = pkg[state.creatorTab];
      return `
        <div class="detail-body">
          <div class="section-head">
            <div>
              <div class="eyebrow">${({
                session: bi(L("Session 包", "Session Package")),
                runtime: bi(L("运行镜像", "Runtime")),
                connectors: bi(L("连接器与凭证", "Connectors & Secrets")),
                release: bi(L("发布与审计", "Release & Audit"))
              })[state.creatorTab]}</div>
              <div class="tab-title">${bi(L("当前选中 package 的详情", "Detail for the selected package"))}</div>
            </div>
            <span class="pill ${pkg.statusClass}">${bi(pkg.status)}</span>
          </div>
          <div class="section-note">${bi(tabData.summary)}</div>
          ${tabData.items.map((item) => `
            <div class="detail-item">
              <div class="file-name">${bi(item)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderCreatorView() {
      const pkg = creatorPackages[state.activePackageId];
      return `
        <section class="view">
          <article class="hero-card">
            <div class="section-head">
              <div>
                <div class="eyebrow">${bi(L("Creator 工作台", "Creator Studio"))}</div>
                <h2 class="hero-title">${bi(L("按 package 管理，工程细节进入独立页面", "Manage by package with dedicated pages for engineering detail"))}</h2>
              </div>
              <span class="pill active">dashboard://creator</span>
            </div>
            <div class="section-note">${bi(L("Creator 页面只保留包选择、状态判断和当前子模块内容。镜像、凭证、发布与审计拆成子页签，保证首屏更适合连续工作。", "The Creator page keeps only package selection, status judgment, and the current submodule. Runtime, credentials, release, and audit are split into subtabs so the first screen is better for sustained work."))}</div>
            ${renderMetricCards([
              { label: bi(L("session 包", "Session packages")), value: "17", note: bi(L("按真实实例打包。", "Packaged from real instances.")) },
              { label: bi(L("可发布工坊", "Releasable workshops")), value: "08", note: bi(L("按工作区和能力策略发布。", "Released by workspace and capability policy.")) },
              { label: bi(L("待审计", "Pending audit")), value: "03", note: bi(L("重点看脱敏与凭证注入。", "Focused on desensitization and secret injection.")) }
            ])}
          </article>

          <div class="creator-layout">
            <div class="conversation-stack">
              ${Object.values(creatorPackages).map((item) => `
                <article class="package-card ${item.id === state.activePackageId ? "active" : ""}" data-select-package="${item.id}">
                  <div class="instance-head">
                    <div class="list-title">${bi(item.title)}</div>
                    <span class="pill ${item.statusClass}">${bi(item.status)}</span>
                  </div>
                  <div class="meta">${bi(item.source)}</div>
                  <div class="pill-row">
                    <span class="path-chip active">${item.id}</span>
                  </div>
                </article>
              `).join("")}
            </div>

            <div class="detail-stack">
              <article class="detail-card">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">${bi(L("当前 package", "Selected Package"))}</div>
                    <div class="detail-title">${bi(pkg.title)}</div>
                    <div class="meta">${bi(pkg.source)}</div>
                  </div>
                  <span class="pill ${pkg.statusClass}">${bi(pkg.status)}</span>
                </div>
                <img class="cover" src="${assets.runtime}" alt="${bi(L("运行结构图", "Runtime map"))}">
                <div class="subtab-row">
                  <button class="subtab-btn ${state.creatorTab === "session" ? "active" : ""}" type="button" data-creator-tab="session">${bi(L("Session 包", "Session Package"))}</button>
                  <button class="subtab-btn ${state.creatorTab === "runtime" ? "active" : ""}" type="button" data-creator-tab="runtime">${bi(L("运行镜像", "Runtime"))}</button>
                  <button class="subtab-btn ${state.creatorTab === "connectors" ? "active" : ""}" type="button" data-creator-tab="connectors">${bi(L("Connectors", "Connectors"))}</button>
                  <button class="subtab-btn ${state.creatorTab === "release" ? "active" : ""}" type="button" data-creator-tab="release">${bi(L("发布审核", "Release & Audit"))}</button>
                </div>
                ${renderCreatorTabContent(pkg)}
              </article>
            </div>
          </div>

          <details class="tech-details">
            <summary>${bi(L("查看 Creator 技术详情", "Show creator technical details"))}</summary>
            <div class="tech-body">
              <div class="tech-grid">
                <div class="tech-box">
                  <h4>${bi(L("标准容器策略", "Standard container policy"))}</h4>
                  <div class="route-code">ubuntu:24.04</div>
                  <div class="route-code">codex-cli / node / python</div>
                  <div class="route-code">playwright / browser bridge</div>
                </div>
                <div class="tech-box">
                  <h4>${bi(L("输出契约目录", "Output contract paths"))}</h4>
                  <div class="route-code">/workspace/&lt;task-id&gt;/receipts/</div>
                  <div class="route-code">/workspace/&lt;task-id&gt;/output/</div>
                  <div class="route-code">/workspace/&lt;task-id&gt;/archive/</div>
                </div>
              </div>
            </div>
          </details>
        </section>
      `;
    }

    function renderCurrentView() {
      switch (state.view) {
        case "workshops":
          return renderWorkshopsView();
        case "instances":
          return renderInstancesView();
        case "creator":
          return renderCreatorView();
        default:
          return renderWorkshopsView();
      }
    }

    function renderLanguageSwitch() {
      langSwitch.innerHTML = `
        <button class="lang-btn ${state.lang === "zh" ? "active" : ""}" type="button" data-lang="zh">
          <svg class="icon" style="display:inline-block;vertical-align:-4px;width:14px;height:14px;margin-right:6px;"><use href="#i-globe"/></svg>中文
        </button>
        <button class="lang-btn ${state.lang === "en" ? "active" : ""}" type="button" data-lang="en">EN</button>
      `;
    }

    function renderWorkspaceChips() {
      workspaceChips.innerHTML = `
        <span class="path-chip active">${bi(L("华港财务组", "Harbor Finance"))}</span>
        <span class="path-chip">${bi(L("个人空间", "Personal"))}</span>
        <span class="path-chip">${bi(L("品牌内容组", "Brand Lab"))}</span>
      `;
    }

    function renderSidebarState() {
      body.dataset.sidebar = state.sidebarOpen ? "open" : "closed";
      sidebarToggleButtons.forEach((button) => {
        button.classList.toggle("active", state.sidebarOpen);
        button.setAttribute("aria-expanded", String(state.sidebarOpen));
        button.setAttribute(
          "aria-label",
          state.sidebarOpen
            ? bi(L("收起左侧抽屉", "Collapse left drawer"))
            : bi(L("展开左侧抽屉", "Expand left drawer"))
        );
      });
      if (sidebarScrim) {
        sidebarScrim.setAttribute("aria-hidden", state.sidebarOpen ? "false" : "true");
      }
    }

    function closeSidebarIfOverlay() {
      if (window.innerWidth <= 1240 && state.sidebarOpen) {
        state.sidebarOpen = false;
      }
    }

    function renderStaticText() {
      html.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.title = state.lang === "zh" ? "灵办词元 Dashboard" : "Lingban Ciyuan Dashboard";

      brandSub.textContent = bi(L("多语言控制台", "Multilingual Console"));
      brandTitle.textContent = bi(L("灵办词元 / Operator Dashboard", "Lingban Ciyuan / Operator Dashboard"));
      brandRoot.textContent = bi(L("默认工作区根路径：/workspace/runs/finance-hk/", "Default workspace root: /workspace/runs/finance-hk/"));

      workspaceEyebrow.textContent = bi(L("工作区切换", "Workspace Switch"));
      workspaceNote.textContent = bi(L("工作区用于切换根路径、成员权限和可见工坊，不在首页铺开全部矩阵。", "Workspaces switch the root path, member scope, and visible workshops without expanding the full matrix on the landing page."));
      renderWorkspaceChips();

      focusEyebrow.textContent = bi(L("当前重点", "Current Focus"));
      focusTitle.textContent = state.view === "workshops"
        ? bi(L("先选工坊", "Pick a workshop"))
        : state.view === "instances"
        ? bi(L("当前实例对话", "Active instance conversation"))
        : bi(L("当前 package", "Selected package"));
      focusNote.textContent = state.view === "workshops"
        ? bi(L("首页强调选择和启动。", "The landing page emphasizes choosing and launching."))
        : state.view === "instances"
        ? bi(L("对话在中央，文件与审计转入右侧。", "Conversation stays central while files and audit move right."))
        : bi(L("镜像、凭证与发布拆到子页签。", "Runtime, secrets, and release are split into subtabs."));

      themeLabel.textContent = bi(L("主题", "Theme"));
      toolbarPrimaryChip.textContent = bi(L("工作区：华港财务组", "Workspace: Harbor Finance Team"));
      toolbarSecondChip.textContent = state.view === "workshops"
        ? bi(L("已发布工坊 08", "Published workshops 08"))
        : state.view === "instances"
        ? bi(L("运行实例 12", "Running instances 12"))
        : bi(L("session 包 17", "Session packages 17"));
      toolbarThirdChip.textContent = state.view === "instances"
        ? bi(L("待审批 1", "Approval 1"))
        : state.view === "creator"
        ? bi(L("待审计 3", "Pending audit 3"))
        : bi(L("最近实例 12", "Recent instances 12"));

      navButtons.forEach((button) => {
        const label = navLabel(button.dataset.target);
        button.querySelector(".nav-text").textContent = label;
        button.setAttribute("aria-label", label);
      });

      railButtons.forEach((button) => {
        const label = navLabel(button.dataset.target);
        button.setAttribute("aria-label", label);
        button.title = label;
      });
    }

    function setActiveButtons() {
      allViewButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.target === state.view);
      });
    }

    function renderViewMeta() {
      const meta = getViewMeta(state.view);
      viewLabel.textContent = meta.label;
      viewTitle.textContent = meta.title;
      viewDesc.textContent = meta.desc;
    }

    function syncUrl() {
      try {
        const url = new URL(window.location.href);
        url.hash = state.view;
        url.searchParams.set("lang", state.lang);
        history.replaceState(null, "", url);
      } catch (error) {
        window.location.hash = state.view;
      }
    }

    function render() {
      body.dataset.theme = state.theme;
      renderSidebarState();
      localStorage.setItem("lingban.dashboard.theme", state.theme);
      localStorage.setItem("lingban.dashboard.lang", state.lang);
      renderStaticText();
      renderLanguageSwitch();
      renderViewMeta();
      viewsRoot.innerHTML = renderCurrentView();
      setActiveButtons();
      syncUrl();
    }

    allViewButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.target;
        closeSidebarIfOverlay();
        render();
      });
    });

    sidebarToggleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.sidebarOpen = !state.sidebarOpen;
        render();
      });
    });

    if (sidebarScrim) {
      sidebarScrim.addEventListener("click", () => {
        if (!state.sidebarOpen) return;
        state.sidebarOpen = false;
        render();
      });
    }

    langSwitch.addEventListener("click", (event) => {
      const button = event.target.closest("[data-lang]");
      if (!button) return;
      state.lang = button.dataset.lang;
      render();
    });

    themeBtn.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      render();
    });

    viewsRoot.addEventListener("click", (event) => {
      const viewButton = event.target.closest("[data-target-view]");
      if (viewButton) {
        state.view = viewButton.dataset.targetView;
        closeSidebarIfOverlay();
        render();
        return;
      }

      const instanceButton = event.target.closest("[data-select-instance]");
      if (instanceButton) {
        state.activeInstanceId = instanceButton.dataset.selectInstance;
        state.view = "instances";
        state.instanceTab = "overview";
        closeSidebarIfOverlay();
        render();
        return;
      }

      const instanceTabButton = event.target.closest("[data-instance-tab]");
      if (instanceTabButton) {
        state.instanceTab = instanceTabButton.dataset.instanceTab;
        render();
        return;
      }

      const packageButton = event.target.closest("[data-select-package]");
      if (packageButton) {
        state.activePackageId = packageButton.dataset.selectPackage;
        state.creatorTab = "session";
        closeSidebarIfOverlay();
        render();
        return;
      }

      const creatorTabButton = event.target.closest("[data-creator-tab]");
      if (creatorTabButton) {
        state.creatorTab = creatorTabButton.dataset.creatorTab;
        render();
      }
    });

    window.addEventListener("hashchange", () => {
      const target = legacyViewMap[window.location.hash.replace("#", "")];
      if (!validViews.includes(target) || target === state.view) return;
      state.view = target;
      render();
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth <= 1240 && state.sidebarOpen) {
        state.sidebarOpen = false;
      }
      renderSidebarState();
    });

    render();
  </script>
</body>
</html>
