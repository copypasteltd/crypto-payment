server {
  listen 38140;
  server_name _;

  root /srv/lingban/current/static/admin;
  index index.html;
  client_max_body_size 16m;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"lingban-admin"}';
  }

  location /admin/v1/ {
    proxy_pass http://127.0.0.1:38100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
