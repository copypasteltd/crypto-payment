services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingban_workshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lingban_workshop}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lingban}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lingban123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lingban}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lingban123}
      LINGBAN_OBJECT_STORAGE_BUCKET: ${LINGBAN_OBJECT_STORAGE_BUCKET:-lingban-local}
    entrypoint:
      - /bin/sh
      - /scripts/minio-init.sh
    volumes:
      - ./minio-init.sh:/scripts/minio-init.sh:ro
    restart: "no"

  runner-image:
    build:
      context: ../..
      dockerfile: infra/docker/runner.Dockerfile
      args:
        OPENAI_CODEX_VERSION: ${OPENAI_CODEX_VERSION:-0.144.1}
    image: lingban/runner:local
    entrypoint:
      - /bin/sh
      - -lc
      - echo "lingban runner image ready"
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - ./compose.env
    ports:
      - "${API_PORT:-3100}:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/var/lib/lingban/api-data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3100/health
      interval: 10s
      timeout: 5s
      retries: 20

  run-worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      runner-image:
        condition: service_completed_successfully
    env_file:
      - ./compose.env
    ports:
      - "${LINGBAN_WORKER_OPS_PORT:-3901}:3901"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker-runs:/var/lib/lingban/worker-runs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LINGBAN_RUNS_DIR: /var/lib/lingban/worker-runs
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3901/health
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-data:
  worker-runs:
