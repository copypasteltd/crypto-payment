  <text class="title" x="40" y="52">灵办词元 Web Dashboard 布局草图</text>
  <text class="subtitle" x="40" y="78">Web 默认入口改为任务服务工坊库。用户侧对象统一为工坊、服务、任务、结果；Session 与 Trace 收敛到 Creator Studio 和 Trace 工作区。</text>

